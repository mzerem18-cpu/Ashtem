#!/bin/bash
set -e

SDK="$(xcrun --sdk iphoneos --show-sdk-path)"

clang -dynamiclib \
  -isysroot "$SDK" \
  -arch arm64 \
  -miphoneos-version-min=13.0 \
  -framework Foundation \
  -framework UIKit \
  -framework QuartzCore \
  -framework CoreGraphics \
  SocialMenu.m \
  -o SocialMenu.dylib

echo "Build successful: SocialMenu.dylib"
file SocialMenu.dylib
